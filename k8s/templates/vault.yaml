{{- if .Values.vault.enabled }}
{{- $fullName := include "manifest.fullname" . -}}
{{- $defaultCert := "" }}
{{- $cert := .Values.vault.cert | default $defaultCert }}

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $fullName }}
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade,pre-install,pre-rollback
    "helm.sh/hook-weight": "-6"
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: {{ .Values.vault.mountPath }}
          role: {{ .Values.vault.authRole }}
          serviceAccountRef:
            name: {{ .Values.vault.authServiceAccount }}
      {{ if semverCompare "<=1.21-0" .Capabilities.KubeVersion.GitVersion }}
            namespace: {{ .Release.Namespace }}
      {{ end }}
      version: {{ .Values.vault.version }}
      path: {{ .Values.vault.secretPreffix }}
      server: {{ .Values.vault.server }}
      caBundle: {{ $cert }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $fullName }}-pgres
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade,pre-install,pre-rollback
    "helm.sh/hook-weight": "-6"
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: {{ .Values.vault.mountPath }}
          role: {{ .Values.vault.authRole }}
          serviceAccountRef:
            name: {{ .Values.vault.authServiceAccount }}
      {{ if semverCompare "<=1.21-0" .Capabilities.KubeVersion.GitVersion }}
            namespace: {{ .Release.Namespace }}
      {{ end }}
      version: {{ .Values.vault.version }}
      path: pgres
      server: {{ .Values.vault.server }}
      caBundle: {{ $cert }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "manifest.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade,pre-install,pre-rollback
    "helm.sh/hook-weight": "-5"
spec:
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: pgres/prod
        property: POSTGRES_USER
      sourceRef:
        storeRef:
          name: {{ $fullName }}-pgres
          kind: SecretStore
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: pgres/prod
        property: POSTGRES_PASSWORD
      sourceRef:
        storeRef:
          name: {{ $fullName }}-pgres
          kind: SecretStore
  dataFrom:
    - extract:
        key: {{ .Values.vault.fetchAllDataFrom }}
  refreshInterval: {{ .Values.vault.secretRefreshInterval }}
  secretStoreRef:
    name: {{ $fullName }}
    kind: SecretStore
  target:
    name: {{ $fullName }}-eso-secret
    creationPolicy: Owner
{{- end }}
