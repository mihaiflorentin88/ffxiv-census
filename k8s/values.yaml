namespace: default

image:
  repository: mihaiflorentin88/census
  pullPolicy: Always
  tag: latest

registry:
  useExistingSecret: true
  secret: "<redacted>"
  secretName: dockerhub

imagePullSecrets:
  - name: dockerhub

serviceAccount:
  create: true
  automount: true
  name: ffxiv-census-sa

persistence:
  enabled: false
  name: ffxiv-census
  accessModes:
    - ReadWriteMany
  size: 10Gi
  storageClass: nfs-rwx

externalPostgres:
  host: pgres-postgresql-rw
  port: "5432"
  database: ffxiv_census

vault:
  enabled: true
  mountPath: kubernetes
  fetchAllDataFrom: census/prod
  authRole: default-namespace
  authServiceAccount: vault-app
  secretPreffix: census
  secretRefreshInterval: 1m
  version: v2
  server: http://vault.default.svc.cluster.local:8200

serviceMonitor:
  enabled: true
  release: monitoring
  interval: 15s
  scrapeTimeout: 10s
  path: /metrics

components:
  webserver:
    enabled: true
  workers:
    enabled: true
  cronjobs:
    enabled: true

webserver:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationValue: "800m"
    targetMemoryUtilizationValue: "800Mi"
    customMetrics:
      - type: External
        external:
          metric:
            name: http_requests_total
            selector:
              matchLabels:
                service: ffxiv-census
          target:
            type: AverageValue
            averageValue: "100"
  service:
    type: ClusterIP
    port: 80
  containerPort: 8080
  command:
    - /app/ffxiv-census
    - server
    - --start
    - --port
    - "8080"
  resources:
    requests:
      memory: 100Mi
      cpu: 50m
    limits:
      memory: 1Gi
      cpu: 1
  podSecurityContext:
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 20
    periodSeconds: 3
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  podAnnotations: {}
  podLabels: {}
  env:
    - name: QUEUE_MAX_ATTEMPTS
      value: "50"
    - name: RABBITMQ_URL
      value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq.default.svc.cluster.local:5672/ffxiv-census"
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/common-name: census.ffxivbard.com
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "20"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "20"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "20"
      nginx.ingress.kubernetes.io/proxy-body-size: "12m"
    hosts:
      - host: census.ffxivbard.com
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ffxiv-census
                port:
                  number: 80

workers:
  defaults:
    terminationGracePeriodSeconds: 180
    resources:
      requests:
        memory: 100Mi
        cpu: 50m
      limits:
        memory: 1Gi
        cpu: 1
    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      runAsNonRoot: true
    env:
      - name: QUEUE_MAX_ATTEMPTS
        value: "50"
      - name: RABBITMQ_URL
        value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq.default.svc.cluster.local:5672/ffxiv-census"
    volumeMounts: []
    volumes: []
  instances:
    # --- Census consumer (all census event types, rate-limited) ---
    - name: census-consumer
      replicaCount: 1
      command:
        - /app/ffxiv-census
        - consume
        - -c
        - "50"
    # --- Proxy consumers (per-event-type with proxy rotation) ---
    - name: proxy-id-sweep
      replicaCount: 1
      command:
        - /app/ffxiv-census
        - consume
        - id-sweep
        - --proxy
        - -c
        - "50"
    - name: proxy-character-census
      replicaCount: 1
      command:
        - /app/ffxiv-census
        - consume
        - character-census
        - --proxy
        - -c
        - "50"
    - name: proxy-achievement-census
      replicaCount: 1
      command:
        - /app/ffxiv-census
        - consume
        - achievement-census
        - --proxy
        - -c
        - "50"
    # --- Proxy discovery/scanning ---
    - name: proxy-new
      replicaCount: 1
      command:
        - /app/ffxiv-census
        - proxy
        - consume
        - -c
        - "10"
    - name: proxy-scan
      replicaCount: 1
      command:
        - /app/ffxiv-census
        - proxy
        - consume
        - scan-proxy
        - -c
        - "50"
    # --- Failed queue retry consumer ---
    - name: failed-retry
      replicaCount: 1
      command:
        - /app/ffxiv-census
        - consume
        - failed
        - -c
        - "10"

cronjobs:
  defaults:
    restartPolicy: OnFailure
    resources:
      requests:
        memory: 100Mi
        cpu: 50m
      limits:
        memory: 1Gi
        cpu: 1
    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      runAsNonRoot: true
    env:
      - name: QUEUE_MAX_ATTEMPTS
        value: "50"
      - name: RABBITMQ_URL
        value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq.default.svc.cluster.local:5672/ffxiv-census"
    volumeMounts: []
    volumes: []
  instances:
    - name: publish-character
      schedule: "30 */3 * * *"
      command:
        - /app/ffxiv-census
        - publish
        - character-census
        - --limit
        - "15000"
    - name: publish-id-sweep
      schedule: "0 * * * *"
      command:
        - /app/ffxiv-census
        - publish
        - id-sweep
        - --auto
        - --batch-size
        - "8000"
        - --chunk-size
        - "10"
    # - name: publish-fc-census disabled for now. please do not remove or uncomment
    #   schedule: "0 6 * * 0"
    #   command:
    #     - /app/ffxiv-census
    #     - publish
    #     - fc-census
    #     - --older-than
    #     - 720h
    #     - --limit
    #     - "500"
    # - name: publish-fill-gaps commented for now, please do not remove or uncomment
    #   schedule: "0 3 1 * *"
    #   command:
    #     - /app/ffxiv-census
    #     - publish
    #     - id-sweep
    #     - --fill-gaps
    #     - --chunk-size
    #     - "100"
    - name: proxy-discover
      schedule: "0 * * * *"
      command:
        - /app/ffxiv-census
        - proxy
        - discover
    - name: proxy-scan
      schedule: "*/20 * * * *"
      command:
        - /app/ffxiv-census
        - proxy
        - scan
