namespace: default

image:
  repository: mihaiflorentin88/census
  pullPolicy: IfNotPresent
  tag: latest

registry:
  useExistingSecret: true
  secret: "<redacted>"
  secretName: dockerhub

imagePullSecrets:
  - name: dockerhub

serviceAccount:
  create: true
  automount: true
  name: ffxiv-census-sa

persistence:
  enabled: false
  name: ffxiv-census
  accessModes:
    - ReadWriteMany
  size: 10Gi
  storageClass: nfs-rwx

postgresql:
  enabled: true
  auth:
    username: census
    database: ffxiv_census
    secretKeys:
      adminPasswordKey: POSTGRES_PASSWORD
      userPasswordKey: POSTGRES_PASSWORD
  primary:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: nfs-rwx

vault:
  enabled: true
  mountPath: kubernetes
  fetchAllDataFrom: census/prod
  authRole: default-namespace
  authServiceAccount: vault-app
  secretPreffix: census
  secretRefreshInterval: 1m
  version: v2
  server: http://vault.default.svc.cluster.local:8200

serviceMonitor:
  enabled: true
  release: monitoring
  interval: 15s
  scrapeTimeout: 10s
  path: /metrics

components:
  webserver:
    enabled: true
  workers:
    enabled: true
  cronjobs:
    enabled: true

webserver:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationValue: "800m"
    targetMemoryUtilizationValue: "800Mi"
    customMetrics:
      - type: External
        external:
          metric:
            name: http_requests_total
            selector:
              matchLabels:
                service: ffxiv-census
          target:
            type: AverageValue
            averageValue: "100"
  service:
    type: ClusterIP
    port: 80
  containerPort: 8080
  command:
    - /app/ffxiv-census
    - server
    - --start
    - --port
    - "8080"
  resources:
    requests:
      memory: 100Mi
      cpu: 50m
    limits:
      memory: 1Gi
      cpu: 1
  podSecurityContext:
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 20
    periodSeconds: 3
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  podAnnotations: {}
  podLabels: {}
  env:
    - name: QUEUE_MAX_ATTEMPTS
      value: "50"
  volumeMounts:
    - name: shared-storage
      mountPath: /data
  volumes:
    - name: shared-storage
      persistentVolumeClaim:
        claimName: ffxiv-census
  nodeSelector: {}
  tolerations: []
  affinity: {}
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/common-name: census.ffxivbard.com
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "20"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "20"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "20"
      nginx.ingress.kubernetes.io/proxy-body-size: "12m"
    hosts:
      - host: census.ffxivbard.com
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ffxiv-census
                port:
                  number: 80

workers:
  defaults:
    resources:
      requests:
        memory: 100Mi
        cpu: 50m
      limits:
        memory: 1Gi
        cpu: 1
    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      runAsNonRoot: true
    env:
      - name: QUEUE_MAX_ATTEMPTS
        value: "50"
    volumeMounts:
      - name: shared-storage
        mountPath: /data
    volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: ffxiv-census
  instances:
    - name: consumer
      replicaCount: 1
      command:
        - /app/ffxiv-census
        - consume
        - all
        - -c
        - "20"

cronjobs:
  defaults:
    restartPolicy: OnFailure
    resources:
      requests:
        memory: 100Mi
        cpu: 50m
      limits:
        memory: 1Gi
        cpu: 1
    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      runAsNonRoot: true
    env:
      - name: QUEUE_MAX_ATTEMPTS
        value: "50"
    volumeMounts:
      - name: shared-storage
        mountPath: /data
    volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: ffxiv-census
  instances:
    - name: backup
      schedule: "0 1 * * *"
      command:
        - /app/ffxiv-census
        - backup
        - --target
        - gdrive
    - name: publish-character
      schedule: "30 */3 * * *"
      command:
        - /app/ffxiv-census
        - publish
        - character-census
        - --limit
        - "1000"
    - name: publish-id-sweep
      schedule: "0 * * * *"
      command:
        - /app/ffxiv-census
        - publish
        - id-sweep
        - --auto
        - --batch-size
        - "3000"
        - --chunk-size
        - "100"
    - name: publish-fc-census
      schedule: "0 6 * * 0"
      command:
        - /app/ffxiv-census
        - publish
        - fc-census
        - --older-than
        - 720h
        - --limit
        - "500"
