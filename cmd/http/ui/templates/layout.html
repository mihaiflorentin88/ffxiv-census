<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Title}}{{.Title}} — {{end}}FFXIV Census</title>
    <link rel="canonical" href="{{.BaseURL}}{{.CanonicalPath}}">
    <meta name="description" content="{{.Description}}">
    <meta property="og:site_name" content="FFXIV Census">
    <meta property="og:title" content="{{if .Title}}{{.Title}} — {{end}}FFXIV Census">
    <meta property="og:description" content="{{.Description}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{.BaseURL}}{{.CanonicalPath}}">
    <link rel="stylesheet" href="/ui/assets/styles.css">
    <script src="/ui/assets/htmx.min.js"></script>
    <script src="/ui/assets/chart.umd.min.js"></script>
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="/ui/dashboard" class="brand">
                <span class="brand-icon">⚔️</span>
                <span>FFXIV CENSUS</span>
            </a>
            <ul class="nav-links">
                <li class="nav-item {{if eq .ActiveNav "dashboard"}}active{{end}}">
                    <a href="/ui/dashboard">Dashboard</a>
                </li>
                <li class="nav-item {{if eq .ActiveNav "races"}}active{{end}}">
                    <a href="/ui/races">Races</a>
                </li>
                <li class="nav-item {{if eq .ActiveNav "worlds"}}active{{end}}">
                    <a href="/ui/worlds">Worlds</a>
                </li>
                <li class="nav-item {{if eq .ActiveNav "expansions"}}active{{end}}">
                    <a href="/ui/expansions">Expansions</a>
                </li>
                <li class="nav-item {{if eq .ActiveNav "methodology"}}active{{end}}">
                    <a href="/ui/methodology">Methodology</a>
                </li>
            </ul>
        </div>
    </header>

    <main class="page-container">
        {{block "content" .}}
        <div class="panel">
            <div class="panel-body">
                <p>Welcome to FFXIV Census.</p>
            </div>
        </div>
        {{end}}
        {{if .StatsUpdated}}
        <p class="stats-freshness{{if .StatsStale}} stats-freshness-stale{{end}}">
            Statistics updated {{.StatsUpdated}}{{if .StatsStale}} · refresh delayed; showing the last available snapshot{{end}}
        </p>
        {{end}}
    </main>

</body>
</html>
