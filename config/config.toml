[app]
name = "ffxiv-census"
env  = "development"

[logging]
default        = "color"
server_default = "color"
level          = "info"

[auth]
enabled = false
token   = "change-me"
routes  = ["/example"]
users   = ["admin:admin:admin|ops"]

[http]
host          = "0.0.0.0"
port          = 8080
read_timeout  = "20s"
write_timeout = "60s"
idle_timeout  = "120s"

[metrics]
endpoint = "127.0.0.1:8125"
prefix   = "ffxiv-census"

[mysql]
host               = "127.0.0.1"
port               = 3306
database           = "ffxiv-census"
username           = "root"
password           = "change-me"
params             = "charset=utf8mb4&parseTime=true&loc=Local"
max_open_conns     = 25
max_idle_conns     = 5
conn_max_lifetime  = "5m"
conn_max_idle_time = "2m"
dial_timeout       = "5s"