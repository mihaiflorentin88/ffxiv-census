[app]
name = "ffxiv-census"
env  = "development"

[logging]
default        = "color"
server_default = "color"
level          = "info"

[auth]
enabled = false
token   = "change-me"
routes  = ["/example"]
users   = ["admin:admin:admin|ops"]

[http]
host          = "0.0.0.0"
port          = 8080
read_timeout  = "20s"
write_timeout = "60s"
idle_timeout  = "120s"

[metrics]
endpoint = "127.0.0.1:8125"
prefix   = "ffxiv-census"

[sqlite]
path = "data/ffxiv-census.db"
max_open_conns = 4
max_idle_conns = 4
busy_timeout = "5s"
journal_mode = "WAL"

[queue]
claim_batch_size = 4
max_attempts = 5
backoff_base_seconds = 5

[lodestone]
rate_limit = 1.0
max_retries = 3

[tomestone]
api_token = ""
base_url = "https://tomestone.gg"
rate_limit = 10.0
timeout = "10s"

[census]
activity_window_days = 30
max_level = 100

[[census.expansions]]
name = "A Realm Reborn"
version = "Patch 2.55"
final_quest = "Before the Dawn"
icon = "🌱"
level_cap = 50
achievement_id = 1129

